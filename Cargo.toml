[package]
name = "gmail-monitor"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
imap = "2.4.1"
mailparse = "0.17.0"
native-tls = "0.2.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
toml = "1.1.6"
ureq = { version = "3.4.1", default-features = false, features = ["native-tls"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
